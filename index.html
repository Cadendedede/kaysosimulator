<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>kayso fart sim</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #unity-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #unity-canvas {
            display: block;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            outline: none;
            background: #000;
        }
    </style>
</head>

<body>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/web build.loader.js";

        var config = {
            dataUrl: buildUrl + "/web build.data.gz",
            frameworkUrl: buildUrl + "/web build.framework.js.gz",
            codeUrl: buildUrl + "/web build.wasm.gz",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "kayso fart sim",
            productVersion: "1.0"
        };

        // Allow Unity to match its render resolution to the canvas.
        // The canvas itself fills the browser viewport.
        function resizeCanvas() {
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";
        }

        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        var unityInstance = null;
        var fullscreenRequested = false;

        function requestFullscreen() {
            if (!unityInstance || fullscreenRequested) return;

            fullscreenRequested = true;

            try {
                unityInstance.SetFullscreen(1);
            } catch (error) {
                console.warn("Fullscreen request failed:", error);
                fullscreenRequested = false;
            }

            document.removeEventListener("pointerdown", requestFullscreen);
            document.removeEventListener("keydown", requestFullscreen);
        }

        var script = document.createElement("script");
        script.src = loaderUrl;

        script.onload = function () {
            createUnityInstance(canvas, config)
                .then(function (instance) {
                    unityInstance = instance;
                    canvas.focus();

                    document.addEventListener(
                        "pointerdown",
                        requestFullscreen
                    );

                    document.addEventListener(
                        "keydown",
                        requestFullscreen
                    );
                })
                .catch(function (message) {
                    console.error("Unity failed to initialize:", message);
                    alert("The game failed to load. Check the browser console.");
                });
        };

        script.onerror = function () {
            console.error("Failed to load Unity loader:", loaderUrl);
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
