<!DOCTYPE html>
<html lang="en-us">
<head>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #unity-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #unity-canvas {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            outline: none;
            background: #000;
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/web build.loader.js";

        var config = {
            dataUrl: buildUrl + "/web build.data.br",
            frameworkUrl: buildUrl + "/web build.framework.js.br",
            codeUrl: buildUrl + "/web build.wasm.br",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "kayso fart sim",
            productVersion: "1.0"
        };

        var script = document.createElement("script");

        script.src = loaderUrl;

        script.onload = function () {
            createUnityInstance(canvas, config, function (progress) {
                // No premade loading UI.
            }).then(function (unityInstance) {
                canvas.focus();

                // Fullscreen is requested only after a user interaction.
                function requestFullscreen() {
                    if (!document.fullscreenElement) {
                        unityInstance.SetFullscreen(1);
                    }

                    document.removeEventListener(
                        "pointerdown", requestFullscreen
                    );
                    document.removeEventListener(
                        "keydown", requestFullscreen
                    );
                }

                document.addEventListener(
                    "pointerdown", requestFullscreen
                );
                document.addEventListener(
                    "keydown", requestFullscreen
                );
            }).catch(function (message) {
                console.error("Unity initialization failed:", message);
                alert(message);
            });
        };

        script.onerror = function () {
            console.error("Failed to load Unity loader:", script.src);
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
